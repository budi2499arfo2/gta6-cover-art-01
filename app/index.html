<!doctype html>
<html lang="en" data-frame="1:1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<meta name="description" content="Turn your own photos and a caption into GTA-style multi-panel cover art, offline in your browser, exported as a PNG.">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">NC</span>
    <span class="brand-text">
      <strong>Neon Coast</strong>
      <em>cover studio</em>
    </span>
  </div>

  <div class="exports" id="export">
    <button type="button" class="export-btn" data-frame="1:1">
      <span class="export-size">1080 × 1080</span>
      <span class="export-note">Square</span>
    </button>
    <button type="button" class="export-btn is-primary" data-frame="4:5">
      <span class="export-size">1080 × 1350</span>
      <span class="export-note">Portrait</span>
    </button>
    <button type="button" class="export-btn" data-frame="16:9">
      <span class="export-size">1920 × 1080</span>
      <span class="export-note">Wide</span>
    </button>
  </div>
</header>

<main class="bench">
  <aside class="rail">

    <section class="card">
      <h2>1 · Photos</h2>
      <div class="dropzone" id="dropzone">
        <p>Drop photos here<br><span>or</span></p>
        <button type="button" id="browse" class="ghost">Browse…</button>
        <input type="file" id="photo" accept="image/*" multiple hidden>
        <small>They never leave this machine.</small>
      </div>
      <div class="thumbs" id="thumbs" aria-label="Loaded photos"></div>
    </section>

    <section class="card">
      <h2>2 · Panels</h2>
      <div class="seg" id="count" role="group" aria-label="Panel count">
        <button type="button" class="seg-btn" data-count="2">2</button>
        <button type="button" class="seg-btn" data-count="3">3</button>
        <button type="button" class="seg-btn is-active" data-count="4">4</button>
        <button type="button" class="seg-btn" data-count="5">5</button>
        <button type="button" class="seg-btn" data-count="6">6</button>
      </div>
      <div class="chips" id="chips" aria-label="Select a panel"></div>
      <p class="hint">Pick a panel, then crop it below.</p>
    </section>

    <section class="card">
      <h2>3 · Crop the panel</h2>
      <label class="slider">
        <span>Zoom <b id="zoom-val">100%</b></span>
        <input type="range" id="zoom" min="90" max="220" value="100">
      </label>
      <label class="slider">
        <span>Move X <b id="offx-val">0</b></span>
        <input type="range" id="offx" min="-60" max="60" value="0">
      </label>
      <label class="slider">
        <span>Move Y <b id="offy-val">0</b></span>
        <input type="range" id="offy" min="-60" max="60" value="0">
      </label>
      <div class="row">
        <button type="button" class="ghost" id="crop-reset">Reset crop</button>
        <button type="button" class="ghost" id="swap">Swap →</button>
      </div>
    </section>

    <section class="card">
      <h2>4 · Caption</h2>
      <input type="text" id="caption" maxlength="42" value="Sunset Heist" placeholder="SUNSET HEIST">
      <input type="text" id="subtitle" maxlength="34" value="a neon coast story" placeholder="a neon coast story">
      <label class="slider">
        <span>Title size <b id="font-val">100%</b></span>
        <input type="range" id="font-scale" min="60" max="140" value="100">
      </label>
    </section>

    <section class="card">
      <h2>5 · Grade &amp; format</h2>
      <div class="presets" id="presets" aria-label="Colour grade"></div>
      <div class="seg" id="frame" role="group" aria-label="Post size">
        <button type="button" class="seg-btn is-active" data-frame="1:1">1:1</button>
        <button type="button" class="seg-btn" data-frame="4:5">4:5</button>
        <button type="button" class="seg-btn" data-frame="16:9">16:9</button>
      </div>
      <div class="row">
        <button type="button" class="ghost" id="shuffle">Shuffle crops</button>
        <button type="button" class="ghost" id="randomize">Surprise me</button>
      </div>
      <p class="keys"><kbd>[</kbd> <kbd>]</kbd> panel &nbsp; <kbd>S</kbd> save PNG</p>
    </section>
  </aside>

  <section class="stage">
    <div class="stage-head">
      <span class="live"><i aria-hidden="true"></i> live preview</span>
      <span class="stage-meta">last export <b id="last-export">—</b></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="cover" width="1080" height="1080" aria-label="Your cover"></canvas>
      <div class="stamp" aria-hidden="true">
        <span class="stamp-tick">✓</span>
        <span>PNG saved<br><b id="stamp-size">1080 × 1080</b></span>
      </div>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">Loading the sample photos…</p>
  </section>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
